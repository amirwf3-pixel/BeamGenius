[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beamgenius"
version = "0.1.0"
description = "Deterministic reinforced-concrete beam engineering core governed by Iranian Mabhas 9"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beamgenius = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
mypy_path = "src"
packages = ["beamgenius"]
